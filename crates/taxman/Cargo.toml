[package]
name = "taxman"
version.workspace = true
edition.workspace = true

[dependencies]
oauth2 = { version = "5.0.0", default-features = false }
serde = { version = "1.0.229", features = ["serde_derive"] }
serde_json = "1.0.151"
taxman-macros = { path = "../macros" }

[dev-dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio", "http1", "server"] }
oauth2 = "5.0.0"
reqwest = { version = "0.13.5", features = ["blocking"] }
tokio = { version = "1.53.1", features = ["full"] }
