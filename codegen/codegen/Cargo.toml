[package]
name = "taxman"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
codegen = [
    "dep:proc-macro2",
    "dep:quote",
    "dep:reqwest",
    "dep:syn",
    "dep:openapi",
    "dep:thiserror",
    "dep:tokio",
]
macros = ["dep:taxman-macros"]
default = ["macros"]

[[bin]]
name = "taxman"
required-features = ["codegen"]

[dependencies]
taxman-macros = { path = "../macros", optional = true }
proc-macro2 = { version = "1.0.107", optional = true }
quote = { version = "1.0.47", optional = true }
reqwest = { version = "0.13.4", features = ["blocking"], optional = true }
syn = { version = "3.0.5", features = ["full"], optional = true }
openapi = { git = "https://github.com/Onli-Collective/OpenAPI.git", optional = true }
thiserror = { version = "2.0.20", optional = true }
tokio = { version = "1.53.3", features = ["macros"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
cargo_toml = { version = "1.0.1", optional = true }
